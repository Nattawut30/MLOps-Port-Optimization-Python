name: Daily Pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with pipeline

      - name: Run pipeline
        run: poetry run python -m src.pipeline

      - name: Publish results to the "latest" release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            data/02_silver/expected_returns.parquet \
            data/03_gold/weights.parquet \
            data/03_gold/risk_metrics.parquet \
            data/03_gold/simulation_terminal_values.parquet \
            data/03_gold/heston_hedge.parquet \
            data/03_gold/run_summary.parquet \
            --title "Latest pipeline run" \
            --notes "Automated data refresh: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Heartbeat commit (keeps the schedule from being auto-disabled)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Last automated run: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .heartbeat
          git add .heartbeat
          git diff --staged --quiet && exit 0
          if [ "$(git log -1 --format='%an')" = "github-actions[bot]" ]; then
            git commit --amend -m "Heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push --force-with-lease origin main
          else
            git commit -m "Heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin main
          fi
